<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Recuperar contraseña - SmartStream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --color1: #1e3c72;
      --color2: #2a5298;
      --color3: #6a1b9a;
      --white: #ffffff;
      --error: #ff5252;
      --success: #4caf50;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(to bottom, var(--color1), var(--color2), var(--color3));
      color: var(--white);
    }

    .card {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 18px;
      padding: 24px 22px 26px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .title-icon {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    h1 {
      font-size: 20px;
      margin: 0;
    }

    p.subtitle {
      margin: 4px 0 18px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75);
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px 11px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.25);
      color: var(--white);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    input:focus {
      border-color: #ffca28;
      box-shadow: 0 0 0 1px rgba(255, 202, 40, 0.6);
      background: rgba(0, 0, 0, 0.4);
    }

    .field {
      margin-bottom: 14px;
    }

    .hint {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 3px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 11px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      background: linear-gradient(to right, #ffca28, #ff9100);
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: default;
      box-shadow: none;
    }

    .btn:not(:disabled):active {
      transform: translateY(1px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.35);
      filter: brightness(0.98);
    }

    .msg {
      margin-top: 12px;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 10px;
      display: none;
    }

    .msg.error {
      display: block;
      background: rgba(244, 67, 54, 0.18);
      border: 1px solid rgba(244, 67, 54, 0.8);
      color: #ffbdbd;
    }

    .msg.success {
      display: block;
      background: rgba(76, 175, 80, 0.18);
      border: 1px solid rgba(129, 199, 132, 0.9);
      color: #c8e6c9;
    }

    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .footer a {
      color: #ffca28;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">
      <div class="title-icon">🔒</div>
      <h1>Recuperar contraseña</h1>
    </div>
    <p class="subtitle">
      Introduce tu correo y una nueva contraseña. Si el correo existe, se actualizará inmediatamente.
    </p>

    <form id="resetForm">
      <div class="field">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          name="correo"
          required
          placeholder="tunombre@correo.com"
        />
      </div>

      <div class="field">
        <label for="password">Nueva contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          minlength="8"
          required
          placeholder="Mínimo 8 caracteres"
        />
        <div class="hint">La nueva contraseña debe tener al menos 8 caracteres.</div>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        Cambiar contraseña
      </button>

      <div id="msg" class="msg"></div>
    </form>

    <div class="footer">
      <span>SmartStream &copy; 2025-2026</span>
    </div>
  </div>

  <script>
    const form = document.getElementById('resetForm');
    const msgBox = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgBox.className = 'msg';
      msgBox.style.display = 'none';

      const correo = document.getElementById('correo').value.trim();
      const password = document.getElementById('password').value;

      if (!correo || !password) {
        showError('Rellena todos los campos.');
        return;
      }
      if (password.length < 8) {
        showError('La contraseña debe tener al menos 8 caracteres.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Actualizando...';

      try {
        const resp = await fetch('https://apismartstream.onrender.com/usuarios/reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            correo,
            nuevaContrasena: password,
          }),
        });

        const data = await resp.json();

        if (!resp.ok) {
          showError(data.error || 'No se pudo actualizar la contraseña.');
        } else {
          showSuccess('Contraseña actualizada correctamente. Ya puedes iniciar sesión con la nueva contraseña.');
          form.reset();
        }
      } catch (err) {
        console.error(err);
        showError('Error de conexión con el servidor. Inténtalo de nuevo más tarde.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Cambiar contraseña';
      }
    });

    function showError(text) {
      msgBox.textContent = text;
      msgBox.className = 'msg error';
      msgBox.style.display = 'block';
    }

    function showSuccess(text) {
      msgBox.textContent = text;
      msgBox.className = 'msg success';
      msgBox.style.display = 'block';
    }
  </script>
</body>
</html>
